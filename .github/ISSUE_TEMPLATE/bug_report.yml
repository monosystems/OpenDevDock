name: Bug Report
description: Report a bug to help us improve
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## Bug Description
        A clear and concise description of what the bug is.

        ## Steps to Reproduce
        1. Go to '...'
        2. Click on '...'
        3. See error

        ## Expected Behavior
        What you expected to happen.

        ## Actual Behavior
        What actually happened.

        ## Environment
        - OS: [e.g. macOS 14.0]
        - App version: [e.g. 0.1.0]

  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Please paste any relevant log output here
      placeholder: Paste logs here...
    validations:
      required: false
