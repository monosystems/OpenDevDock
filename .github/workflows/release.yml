name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-workflow
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    steps:
      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          fail_on_unmatched_files: false

  build-and-upload:
    name: Build and upload (${{ matrix.platform.name }})
    needs: create-release
    runs-on: ${{ matrix.platform.runner }}
    env:
      TAURI_SKIP_SIGNING: true
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS
            runner: macos-latest
            bundles: app
          - name: Linux
            runner: ubuntu-latest
            bundles: appimage,deb
          - name: Windows
            runner: windows-latest
            bundles: nsis

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Resolve Rust target
        id: target
        shell: bash
        run: |
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64)
              echo "target=x86_64-unknown-linux-gnu" >> "$GITHUB_OUTPUT"
              ;;
            Windows-X64)
              echo "target=x86_64-pc-windows-msvc" >> "$GITHUB_OUTPUT"
              ;;
            macOS-ARM64)
              echo "target=aarch64-apple-darwin" >> "$GITHUB_OUTPUT"
              ;;
            macOS-X64)
              echo "target=x86_64-apple-darwin" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported runner: ${{ runner.os }}-${{ runner.arch }}"
              exit 1
              ;;
          esac

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust target
        shell: bash
        run: rustup target add "${{ steps.target.outputs.target }}"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libglib2.0-dev \
            libssl-dev \
            patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri application
        run: pnpm tauri build --target "${{ steps.target.outputs.target }}" --bundles "${{ matrix.platform.bundles }}"

      - name: Prepare macOS asset
        if: runner.os == 'macOS'
        shell: bash
        run: |
          shopt -s nullglob
          apps=(src-tauri/target/${{ steps.target.outputs.target }}/release/bundle/macos/*.app)
          if [ ${#apps[@]} -eq 0 ]; then
            echo "No .app bundle found"
            exit 1
          fi

          mkdir -p release-assets
          ditto -c -k --sequesterRsrc --keepParent "${apps[0]}" "release-assets/${apps[0]##*/}.zip"

      - name: Prepare Linux assets
        if: runner.os == 'Linux'
        shell: bash
        run: |
          shopt -s nullglob
          mkdir -p release-assets

          appimages=(src-tauri/target/${{ steps.target.outputs.target }}/release/bundle/appimage/*.AppImage)
          debs=(src-tauri/target/${{ steps.target.outputs.target }}/release/bundle/deb/*.deb)

          if [ ${#appimages[@]} -eq 0 ] || [ ${#debs[@]} -eq 0 ]; then
            echo "Expected AppImage and .deb outputs were not found"
            exit 1
          fi

          cp "${appimages[@]}" release-assets/
          cp "${debs[@]}" release-assets/

      - name: Prepare Windows asset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $assetDir = "release-assets"
          New-Item -ItemType Directory -Force -Path $assetDir | Out-Null

          $executables = Get-ChildItem -Path "src-tauri/target/${{ steps.target.outputs.target }}/release/bundle/nsis" -Filter "*.exe"
          if ($executables.Count -eq 0) {
            throw "No .exe installer found"
          }

          Copy-Item -Path $executables.FullName -Destination $assetDir

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: release-assets/*
          fail_on_unmatched_files: true
