name-template: "$RESOLVED_VERSION"
tag-template: "$RESOLVED_VERSION"
change-template: "- $TITLE"
change-title-escapes: "<*_&"
template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...$RESOLVED_VERSION
no-changes-template: "- No changes"
exclude-labels:
  - skip-changelog
categories:
  - title: Features
    labels:
      - feat
  - title: Bug Fixes
    labels:
      - fix
  - title: Documentation
    labels:
      - docs
  - title: Refactoring / Chores
    labels:
      - chore
      - refactor
      - test
  - title: Other
    labels:
      - other
version-resolver:
  major:
    labels:
      - major
  minor:
    labels:
      - feat
      - minor
  patch:
    labels:
      - fix
      - chore
      - refactor
      - docs
      - test
      - other
      - patch
  default: patch
autolabeler:
  - label: feat
    title:
      - '/^feat(\(.+\))?:\s.+/'
  - label: fix
    title:
      - '/^fix(\(.+\))?:\s.+/'
  - label: docs
    title:
      - '/^docs(\(.+\))?:\s.+/'
  - label: chore
    title:
      - '/^chore(\(.+\))?:\s.+/'
  - label: refactor
    title:
      - '/^refactor(\(.+\))?:\s.+/'
  - label: test
    title:
      - '/^test(\(.+\))?:\s.+/'
  - label: other
    title:
      - '/^(?!feat(\(.+\))?:\s.+|fix(\(.+\))?:\s.+|docs(\(.+\))?:\s.+|chore(\(.+\))?:\s.+|refactor(\(.+\))?:\s.+|test(\(.+\))?:\s.+).+/'
replacers:
  - search: '/^- feat(\(.+\))?:\s+/gm'
    replace: '- Feature: '
  - search: '/^- fix(\(.+\))?:\s+/gm'
    replace: '- Fix: '
  - search: '/^- docs(\(.+\))?:\s+/gm'
    replace: '- Documentation: '
  - search: '/^- chore(\(.+\))?:\s+/gm'
    replace: '- Chore: '
  - search: '/^- refactor(\(.+\))?:\s+/gm'
    replace: '- Refactoring: '
  - search: '/^- test(\(.+\))?:\s+/gm'
    replace: '- Test: '
