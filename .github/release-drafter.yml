name: Release Drafter

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - main

permissions:
  contents: read

jobs:
  update_release_draft:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v6
        with:
          tag-resolver: conventional
          template: |
            ## {{currentTag}}

            {{#each categories}}
            ### {{name}}
            {{#if commits}}
            {{commits}}
            {{else}}
            *No changes in this category.*
            {{/if}}
            {{/each}}

            **Full Changelog**: {{previousTag}}...{{currentTag}}
          commit_filters:
            exclude:
              - merge_commit: true
          include-open-issues: true
          exclude-labels:
            - skip-changelog
          categories:
            - title: Features
              labels:
                - feat
                - feature
              commit_pattern: "^(feat|feat-core|feat-ui)(:\\s(.*))?$"
            - title: Bug Fixes
              labels:
                - fix
                - bugfix
              commit_pattern: "^(fix|fix-core|fix-ui)(:\\s(.*))?$"
            - title: Desktop / Tauri
              labels:
                - tauri
                - desktop
                - backend
                - rust
            - title: Dependencies
              labels:
                - dependencies
                - deps
            - title: Documentation
              labels:
                - documentation
                - docs
              commit_pattern: "^docs(:.*)?$"
            - title: Refactoring / Chores
              labels:
                - refactoring
                - chore
                - test
