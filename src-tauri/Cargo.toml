[package]
name = "opendevdock"
version = "0.1.0"
description = "Terminal-first Developer Workspace"
authors = ["you"]
edition = "2021"

[lib]
name = "opendevdock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
portable-pty = "0.9"
